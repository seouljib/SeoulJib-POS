<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seoul Jib" />
    <meta name="theme-color" content="#c0392b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <script>
      // ── 서버 선택 (클라우드 우선, 파이 예비) ──
      // 태블릿 앱은 파이 주소로 들어옴 → 클라우드에 닿으면 클라우드로 넘김 (기기 설정도 같이 넘김)
      // 클라우드에 닿지 않으면(인터넷 장애) 파이에서 그대로 실행
      (function () {
        var CLOUD = "https://seoul-jib-pos.web.app";
        var PI = "http://192.168.68.62:5173";
        var KEYS = ["sj-table-v10", "sj-main-v10", "sj-server-v10", "sj-printer-ip", "sj-autoprint"];
        window.__SJ_CLOUD = CLOUD; window.__SJ_PI = PI;
        var isCloud = location.origin === CLOUD || /\.web\.app$|\.firebaseapp\.com$/.test(location.hostname);
        window.__SJ_ORIGIN = isCloud ? "cloud" : "pi";
        // 자동 업데이트 직후의 화면 복원 정보는 앱이 읽으면서 지우므로 미리 잡아 둠
        var resume = null;
        try { resume = sessionStorage.getItem("sj-resume"); } catch (e) {}
        function enc(o) { try { return encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o))))); } catch (e) { return ""; } }
        function dec(s) { try { return JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(s))))); } catch (e) { return null; } }
        // 다른 주소에서 넘어올 때 함께 온 설정 적용
        var m = location.hash.match(/[#&]sjcfg=([^&]+)/);
        if (m) {
          var cfg = dec(m[1]);
          if (cfg) {
            Object.keys(cfg.ls || {}).forEach(function (k) { if (KEYS.indexOf(k) >= 0) { try { localStorage.setItem(k, cfg.ls[k]); } catch (e) {} } });
            if (cfg.resume) { try { sessionStorage.setItem("sj-resume", cfg.resume); } catch (e) {} }
          }
          try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
        }
        // 다른 서버로 이동 (기기 설정 + 화면 복원 정보 동반)
        window.__sjGo = function (target) {
          var ls = {};
          KEYS.forEach(function (k) { try { var v = localStorage.getItem(k); if (v !== null) ls[k] = v; } catch (e) {} });
          location.replace(target + "#sjcfg=" + enc({ ls: ls, resume: resume }));
        };
        if (isCloud) { window.__sjBoot = Promise.resolve(); return; }
        // 파이에서 열린 경우
        if (/[?&]local=1/.test(location.search)) {
          // 클라우드에서 문제가 생겨 돌아온 경우: 30분 동안은 파이에 머묾
          try { sessionStorage.setItem("sj-local-until", String(Date.now() + 30 * 60 * 1000)); } catch (e) {}
          window.__sjBoot = Promise.resolve(); return;
        }
        var until = 0;
        try { until = Number(sessionStorage.getItem("sj-local-until") || 0); } catch (e) {}
        if (until > Date.now()) { window.__sjBoot = Promise.resolve(); return; }
        window.__sjBoot = new Promise(function (resolve) {
          var done = false;
          var t = setTimeout(function () { if (!done) { done = true; resolve(); } }, 3000);
          // 클라우드에 우리 앱이 실제로 올라가 있는지 확인 (오류 페이지로 넘어가는 것 방지)
          fetch(CLOUD + "/sj-alive.json?_t=" + Date.now(), { mode: "cors", cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              if (done) return; done = true; clearTimeout(t);
              if (j && j.app === "seouljib-pos") window.__sjGo(CLOUD + "/"); else resolve();
            })
            .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(); } });
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 글꼴은 화면 표시를 막지 않도록 비동기로 불러옴: 인터넷이 느리거나 끊겨도 기본 글꼴로 바로 화면이 뜸 -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <script src="/epos-2.27.0.js"></script>
    <title>Seoul Jib POS</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #fff7f0; }
      body { overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
    <script>
      // 흰 화면 감시: 25초 안에 앱 화면이 그려지지 않으면 자동 새로고침 (연속 3번까지)
      // 그래도 안 되면: 클라우드에서 열린 경우 파이로 전환, 파이에서 열린 경우 다시 시도 버튼
      (function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          var n = 0;
          try { n = Number(sessionStorage.getItem('sj-wd') || 0); } catch (e) {}
          if (root && root.children.length > 0) { try { sessionStorage.removeItem('sj-wd'); } catch (e) {} return; }
          if (n < 3) {
            try { sessionStorage.setItem('sj-wd', String(n + 1)); } catch (e) {}
            location.reload();
          } else if (window.__SJ_ORIGIN === 'cloud' && window.__sjGo) {
            try { sessionStorage.removeItem('sj-wd'); } catch (e) {}
            window.__sjGo(window.__SJ_PI + '/?local=1');
          } else if (root) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;text-align:center;padding:24px">'
              + '<div style="font-size:26px;font-weight:800;margin-bottom:12px">Cannot load the app</div>'
              + '<div style="font-size:16px;color:#666;margin-bottom:24px">Check the server, then tap Retry.</div>'
              + '<button id="sjRetry" style="font-size:18px;font-weight:800;padding:14px 28px;border:none;border-radius:12px;background:#c0392b;color:#fff">Retry</button></div>';
            document.getElementById('sjRetry').onclick = function () { try { sessionStorage.removeItem('sj-wd'); } catch (e) {} location.reload(); };
          }
        }, 25000);
      })();
    </script>
  </body>
</html>
